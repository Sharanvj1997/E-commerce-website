<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<nav class="navbar navbar-expand-lg navbar-light bg-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}" style="color:white;">
      <i class="fas fa-shopping-cart"></i> ShopKart
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
      aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      <div class="navbar-nav ms-auto">
        <a class="nav-link active" aria-current="page" href="{% url 'home' %}" style="color:white;">
          <i class="fas fa-home"></i> Home
        </a>

        {% if request.user.is_authenticated %}
          <!-- Show when user is logged in -->
          <a class="nav-link" href="#" style="color:white;">
            <i class="fas fa-user"></i> {{ request.user.username }}
          </a>
          <a class="nav-link" href="{% url 'logout' %}" style="color:white;">
            <i class="fas fa-sign-out-alt"></i> Logout
          </a>
        {% else %}
          <!-- Show when user is not logged in -->
          <a class="nav-link" href="{% url 'register' %}" style="color:white;">
            <i class="fas fa-user-plus"></i> Register
          </a>
          <a class="nav-link" href="{% url 'login' %}" style="color:white;">
            <i class="fas fa-sign-in-alt"></i> Login
          </a>
        {% endif %}

        <a class="nav-link" href="{% url 'collections' %}" style="color:white;">
          <i class="fas fa-box"></i> Collections
        </a>

        <a class="nav-link" href="{% url 'view_cart' %}" style="color:white;">
          <i class="fas fa-credit-card"></i> Cart
        </a>

        <a class="nav-link" href="{% url 'view_fav' %}" style="color:white;">
          <i class="fas fa-heart"></i> Favourite
        </a>
        
      </div>
    </div>
  </div>
</nav>
